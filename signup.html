<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Netixa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1e0a3d;
            --marketing-red: #b90404;
            --blue-accent: #2563eb;
            --text-main: #111827;
            --text-secondary: #4b5563;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { 
            background: #000;
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .logo {
            font-family: 'Outfit';
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        h1 {
            font-family: 'Outfit';
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: rgba(255,255,255,0.8);
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: #fff;
            transition: 0.3s;
            outline: none;
        }
        input:focus {
            border-color: var(--blue-accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--blue-accent), #6333ff);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit';
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 51, 255, 0.3);
            filter: brightness(1.1);
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
        
        .toggle-auth {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }
        .toggle-auth a {
            color: var(--blue-accent);
            text-decoration: none;
            font-weight: 700;
        }
    
        /* Global Mobile Typography Fix */
        @media (max-width: 600px) {
            h1[style*="font-size"], h2[style*="font-size"], h3[style*="font-size"],
            .highlight-text-main, h2.headline-h2, .hero h1, .promo-banner h2 {
                font-size: 27px !important;
                line-height: 1.3 !important;
                margin-bottom: 0px !important;
            }
            .paragraph-text, .hero p, .promo-banner p {
                font-size: 15px !important;
                line-height: 1.5 !important;
            }
            .banner-section, .slider-section {
                margin-bottom: 0px !important;
                padding-bottom: 0px !important;
            }
        }
</style>
</head>
<body>
    <div class="login-card">
        <div class="logo">NETIXA</div>
        <h1>Join the Mastery</h1>
        
        <form id="signupForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="E.g. John Doe" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Create Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login" id="signupBtn">CREATE ACCOUNT →</button>
            <div id="error" class="error-msg">Passwords do not match!</div>
        </form>

        <div class="toggle-auth">
            Already have an account? <a href="login">Sign In</a>
        </div>

        <a href="index" class="back-link">← Return to Website</a>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const error = document.getElementById('error');

            if (password !== confirm) {
                error.style.display = 'block';
                error.innerText = "Passwords do not match!";
                return;
            }

            if (password.length < 6) {
                error.style.display = 'block';
                error.innerText = "Password must be at least 6 characters.";
                return;
            }

            // SIMULATED REGISTRATION
            let users = JSON.parse(localStorage.getItem('netixa_users') || '[]');
            if (users.find(u => u.email === email)) {
                error.style.display = 'block';
                error.innerText = "Email already registered!";
                return;
            }

            users.push({ name, email, password });
            localStorage.setItem('netixa_users', JSON.stringify(users));

            // Auto Login
            localStorage.setItem('netixa_auth', JSON.stringify({ name, email, role: 'student' }));
            
            document.getElementById('signupBtn').innerText = "Creating Account...";
            setTimeout(() => {
                window.location.href = 'user-dashboard';
            }, 1000);
        });
    </script>
</body>
</html>
