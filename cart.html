<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Cart | Netixa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1e0a3d;
            --marketing-red: #b90404;
            --blue-accent: #2563eb;
            --purple-glow: #6333ff;
            --text-main: #111827;
            --text-secondary: #4b5563;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
            padding: 40px 20px;
        }
        .header {
            width: 100%;
            padding: 20px 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .header .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo-text {
            font-family: 'Outfit';
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
        }
        .container {
            max-width: 800px;
            margin: 100px auto 0;
            background: #0c0c0c;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Outfit';
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .cart-item:hover { background: rgba(255,255,255,0.02); }
        .item-info { display: flex; align-items: center; gap: 20px; }
        .item-icon { font-size: 32px; }
        .item-details b { display: block; font-size: 18px; margin-bottom: 4px; }
        .item-details span { color: rgba(255,255,255,0.5); font-size: 14px; }
        .item-price { font-weight: 800; font-size: 20px; color: var(--marketing-red); }
        .btn-remove {
            color: #ff4d4d;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            padding: 8px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-remove:hover { background: rgba(255, 77, 77, 0.1); }
        .cart-footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-family: 'Outfit';
        }
        .total-label { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.5); }
        .total-value { font-size: 32px; font-weight: 900; color: #fff; }
        .btn-checkout {
            display: block;
            width: 100%;
            padding: 20px;
            background: var(--marketing-red);
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            font-family: 'Outfit';
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(185, 4, 4, 0.2);
            transition: 0.3s;
        }
        .btn-checkout:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(185, 4, 4, 0.3);
            background: #d40000;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 0;
        }
        .empty-cart p { font-size: 18px; color: rgba(255,255,255,0.5); margin-bottom: 30px; }
        .btn-shop {
            display: inline-block;
            padding: 14px 30px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
        }
        @media (max-width: 600px) {
            .header { padding: 14px 0 !important; }
        }
    
        /* Global Mobile Typography Fix */
        @media (max-width: 600px) {
            h1[style*="font-size"], h2[style*="font-size"], h3[style*="font-size"],
            .highlight-text-main, h2.headline-h2, .hero h1, .promo-banner h2 {
                font-size: 27px !important;
                line-height: 1.3 !important;
                margin-bottom: 0px !important;
            }
            .paragraph-text, .hero p, .promo-banner p {
                font-size: 15px !important;
                line-height: 1.5 !important;
            }
            .banner-section, .slider-section {
                margin-bottom: 0px !important;
                padding-bottom: 0px !important;
            }
            /* Button Tweak */
            .btn-book {
                padding: 14px 24px !important;
                width: 100%;
                max-width: 320px;
                margin-left: auto;
                margin-right: auto;
            }
            .btn-text { font-size: 15px !important; }
            .btn-price { font-size: 13px !important; }
            .btn-price b { font-size: 18px !important; }
            span[style*="font-size: 24px"] { font-size: 18px !important; } /* Hardcoded big text targeting */
            span[style*="font-size: 28px"] { font-size: 22px !important; } /* Hardcoded big price targeting */
        }
</style>
</head>
<body>
    <header class="header">
        <div class="container-fluid" style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
            <a href="index" class="logo-text">NETIXA</a>
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="product" style="text-decoration: none; font-weight: 700; color: var(--blue-accent);">← Continue Shopping</a>
                <div id="authNavContainer"></div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>🛒 Your Shopping Cart</h1>
        
        <div id="cartList">
            <!-- Items injected here -->
        </div>

        <div id="cartFooter" class="cart-footer" style="display: none;">
            <div class="total-row">
                <div class="total-label">Total Amount</div>
                <div class="total-value" id="totalValue">₹0</div>
            </div>
            <a href="buyform" class="btn-checkout">PROCEED TO CHECKOUT →</a>
        </div>

        <div id="emptyState" class="empty-cart" style="display: none;">
            <p>Your cart is looking a bit hungry...</p>
            <a href="product" class="btn-shop">Explore Our Products</a>
        </div>
    </div>

    <script>
        const products_db = {
            'masterclass': { name: 'Netixa Masterclass Reservation', price: 9, icon: '🚀' },
            'ebook': { name: 'Ultimate Digital Career Mastery E-Book', price: 499, icon: '📘' },
            'templates': { name: '100+ High-Converting Landing Pages', price: 799, icon: '🎨' },
            'email': { name: 'Email Automation Workflows', price: 299, icon: '⚙️' },
            'roadmap': { name: 'The Digital Freelance Roadmap', price: 199, icon: '🗺️' }
        };

        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('netixa_cart') || '[]');
            const listEl = document.getElementById('cartList');
            const footerEl = document.getElementById('cartFooter');
            const emptyEl = document.getElementById('emptyState');
            
            listEl.innerHTML = '';
            
            if (cart.length === 0) {
                footerEl.style.display = 'none';
                emptyEl.style.display = 'block';
                return;
            }

            footerEl.style.display = 'block';
            emptyEl.style.display = 'none';
            
            let total = 0;
            cart.forEach(id => {
                const p = products_db[id];
                if (p) {
                    total += p.price;
                    listEl.innerHTML += `
                        <div class="cart-item">
                            <div class="item-info">
                                <span class="item-icon">${p.icon}</span>
                                <div class="item-details">
                                    <b>${p.name}</b>
                                    <span>Instant Access after payment</span>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 30px;">
                                <div class="item-price">₹${p.price}</div>
                                <button class="btn-remove" onclick="removeFromCart('${id}')">Remove</button>
                            </div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('totalValue').innerText = `₹${total}`;
        }

        function removeFromCart(id) {
            let cart = JSON.parse(localStorage.getItem('netixa_cart') || '[]');
            cart = cart.filter(item => item !== id);
            localStorage.setItem('netixa_cart', JSON.stringify(cart));
            renderCart();
        }

        window.onload = () => {
            renderCart();
            updateAuthNav();
        };

        // Check for authenticated user and update navigation if needed
        function updateAuthNav() {
            const auth = JSON.parse(localStorage.getItem('netixa_auth') || '{}');
            const authNav = document.getElementById('authNavContainer');
            
            if (auth.email) {
                // User is logged in
                const initial = auth.email.charAt(0).toUpperCase();
                authNav.innerHTML = `
                    <a href="user-dashboard" style="width: 32px; height: 32px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; font-size: 14px; text-decoration: none;" title="Go to Dashboard">${initial}</a>
                `;
            }
        }
    </script>
</body>
</html>
