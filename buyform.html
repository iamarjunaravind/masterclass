<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Your Spot | Netixa Masterclass</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1e0a3d;
            --marketing-red: #b90404;
            --blue-accent: #2563eb;
            --purple-glow: #6333ff;
            --text-main: #111827;
            --text-secondary: #4b5563;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            width: 100%;
            background: #0c0c0c;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .form-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--marketing-red), var(--purple-glow));
        }
        .logo {
            font-family: 'Outfit';
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        h1 {
            font-family: 'Outfit';
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.5);
        }
        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
            outline: none;
        }
        input:focus {
            border-color: var(--blue-accent);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--marketing-red);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit';
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(185, 4, 4, 0.2);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(185, 4, 4, 0.3);
            background: #d40000;
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 25px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="logo">NETIXA</div>
        <h1 id="checkoutTitle">Checkout Summary</h1>
        
        <div id="cartSummary" style="margin-bottom: 30px; padding: 20px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;">
            <!-- Cart items will be injected here -->
        </div>

        <form id="leadForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="entry.1509955695" placeholder="John Doe" required>
            </div>
            
            <div class="input-group">
                <label for="email">E-mail Address</label>
                <input type="email" id="email" name="entry.136054716" placeholder="john@example.com" required>
            </div>
            
            <div class="input-group">
                <label for="whatsapp">WhatsApp Number</label>
                <input type="tel" id="whatsapp" name="entry.1946851346" placeholder="+91 0000000000" required>
            </div>
            
            <div class="input-group">
                <label for="city">State / City</label>
                <input type="text" id="city" name="entry.1678080981" placeholder="Kerala / Kozhikode" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">PAY & COMPLETE ORDER →</button>
        </form>

        <!-- Hidden Iframe for Google Form background submission -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
        <form action="https://docs.google.com/forms/d/e/1FAIpQLSe4lKcppg4F1xK_W0WRqy8YF8vyKNkD6wYbn8RqxQg002UeHw/formResponse" 
              method="POST" 
              id="googleSubmitForm" 
              target="hidden_iframe" 
              style="display:none;">
            <input type="hidden" name="entry.1509955695" id="gName">
            <input type="hidden" name="entry.136054716" id="gEmail">
            <input type="hidden" name="entry.1946851346" id="gWhatsapp">
            <input type="hidden" name="entry.1678080981" id="gCity">
        </form>

        <a href="index.html" class="back-link">← Cancel and return</a>
        
        <p class="footer-note">Secure Payment • Powered by Razorpay • Netixa Masterclass 2026</p>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const products_db = {
            'masterclass': { name: 'Netixa Masterclass Reservation', price: 9, icon: '🚀' },
            'ebook': { name: 'Ultimate Digital Career Mastery E-Book', price: 499, icon: '📘' },
            'templates': { name: '100+ High-Converting Landing Pages', price: 799, icon: '🎨' },
            'email': { name: 'Email Automation Workflows', price: 299, icon: '⚙️' },
            'roadmap': { name: 'The Digital Freelance Roadmap', price: 199, icon: '🗺️' }
        };

        const auth = JSON.parse(localStorage.getItem('netixa_auth') || '{}');
        if (auth.email) {
            window.onload = () => {
                renderCart();
                document.getElementById('email').value = auth.email;
                // If it's a student, we can assume they have a name in profile later
            };
        }

        const leadForm = document.getElementById('leadForm');
        const submitBtn = document.getElementById('submitBtn');
        let totalAmount = 0;

        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('netixa_cart') || '[]');
            // If cart is empty, add the masterclass by default (as it was before)
            if (cart.length === 0) {
                cart = ['masterclass'];
            }

            const summaryEl = document.getElementById('cartSummary');
            summaryEl.innerHTML = '';
            totalAmount = 0;

            cart.forEach(id => {
                const p = products_db[id];
                if (p) {
                    totalAmount += p.price;
                    summaryEl.innerHTML += `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center;">
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span style="font-size: 20px;">${p.icon}</span>
                                <div style="font-size: 13px; font-weight: 700; color: #fff;">${p.name}</div>
                            </div>
                            <div style="font-weight: 800; color: var(--marketing-red);">₹${p.price}</div>
                        </div>
                    `;
                }
            });

            summaryEl.innerHTML += `
                <div style="border-top: 1px dashed rgba(255,255,255,0.1); margin-top: 15px; padding-top: 15px; display: flex; justify-content: space-between;">
                    <div style="font-weight: 800; font-family: 'Outfit'; color: #fff;">TOTAL</div>
                    <div style="font-weight: 900; font-size: 20px; color: #fff;">₹${totalAmount}</div>
                </div>
            `;
        }

        leadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const city = document.getElementById('city').value;

            // 1. SYNC TO GOOGLE SHEET (Background)
            document.getElementById('gName').value = name;
            document.getElementById('gEmail').value = email;
            document.getElementById('gWhatsapp').value = whatsapp;
            document.getElementById('gCity').value = city;
            document.getElementById('googleSubmitForm').submit();

            // 2. PROCEED TO RAZORPAY
            submitBtn.disabled = true;
            submitBtn.textContent = 'Opening Payment Window...';

            const options = {
                "key": "rzp_live_SOdqFD6JoEcac2",
                "amount": totalAmount * 100, // Dynamic total in paise
                "currency": "INR",
                "name": "NETIXA EDUCATION",
                "description": "Order for Digital Career Vault",
                "image": "mentor.png",
                "handler": function (response){
                    // Save to user history if logged in
                    if (auth.role === 'student') {
                        let orders = JSON.parse(localStorage.getItem('netixa_orders') || '[]');
                        let cart = JSON.parse(localStorage.getItem('netixa_cart') || '[]');
                        if (cart.length === 0) cart = ['masterclass'];
                        
                        cart.forEach(id => {
                            orders.push({
                                productName: products_db[id].name,
                                date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                                paymentId: response.razorpay_payment_id
                            });
                        });
                        localStorage.setItem('netixa_orders', JSON.stringify(orders));
                    }

                    // Clear cart on success
                    localStorage.removeItem('netixa_cart');
                    window.location.href = `success.html?payment_id=${response.razorpay_payment_id}`;
                },
                "prefill": {
                    "name": name,
                    "email": email,
                    "contact": whatsapp
                },
                "notes": {
                    "location": city,
                    "source": "Masterclass Website",
                    "cart": localStorage.getItem('netixa_cart') || 'masterclass'
                },
                "theme": {
                    "color": "#1e0a3d"
                },
                "modal": {
                    "ondismiss": function(){
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'PAY & COMPLETE ORDER →';
                    }
                }
            };

            const rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
                submitBtn.disabled = false;
                submitBtn.textContent = 'PAY & COMPLETE ORDER →';
            });

            rzp1.open();
        });

        window.onload = renderCart;
    </script>
</body>
</html>
